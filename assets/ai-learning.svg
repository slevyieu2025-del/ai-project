<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="t d">
  <title id="t">How AI works in three steps</title>
  <desc id="d">Data such as text, images, code and audio goes into software that finds patterns, which then produces predictions and answers.</desc>
  <rect width="720" height="220" fill="#FFFFFF"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#1B1B1F" text-anchor="middle">
    <rect x="20" y="50" width="190" height="120" rx="10" fill="#DDEBF7" stroke="#1B1B1F" stroke-width="2"/>
    <text x="115" y="95" font-size="20" font-weight="700">1. Data</text>
    <text x="115" y="125" font-size="15">text, images,</text>
    <text x="115" y="145" font-size="15">code, audio</text>
    <rect x="265" y="50" width="190" height="120" rx="10" fill="#E6DDF5" stroke="#1B1B1F" stroke-width="2"/>
    <text x="360" y="95" font-size="20" font-weight="700">2. Patterns</text>
    <text x="360" y="125" font-size="15">software learns</text>
    <text x="360" y="145" font-size="15">from examples</text>
    <rect x="510" y="50" width="190" height="120" rx="10" fill="#FFE6BF" stroke="#1B1B1F" stroke-width="2"/>
    <text x="605" y="95" font-size="20" font-weight="700">3. Predictions</text>
    <text x="605" y="125" font-size="15">answers, text,</text>
    <text x="605" y="145" font-size="15">images</text>
    <path d="M214 110 H258 M246 100 L258 110 L246 120" fill="none" stroke="#1B1B1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M459 110 H503 M491 100 L503 110 L491 120" fill="none" stroke="#1B1B1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
